#@ load("/lib/validation.star", "is_dns_label", "is_mesh_provider")

#@data/values-schema
---

#@schema/desc "The namespace in which to deploy Flagger."
#@schema/validation ("a valid DNS label", is_dns_label), min_len=1, max_len=63
namespace: flagger-system

#! =============================================
#! Progressive Delivery
#! =============================================

#@schema/desc "The default provider managing the traffic of the Canaries, used when a Canary doesn't set `spec.provider`. With `gatewayapi:v1`, Flagger shifts the traffic via HTTPRoutes, like the ones attached to the Gateways of the Kadras Envoy Gateway package. With `knative`, it shifts the traffic between the revisions of Knative Services. With `kubernetes`, it runs blue/green deployments without shifting traffic. See https://docs.flagger.app/main/usage/deployment-strategies."
#@schema/validation ("a provider supported by Flagger, like `gatewayapi:v1`, `knative`, or `kubernetes`", is_mesh_provider)
mesh_provider: "gatewayapi:v1"

#@schema/desc "The URL of the Prometheus server queried by the built-in metrics of the canary analysis (`request-success-rate` and `request-duration`). MetricTemplates set their own address."
#@schema/validation min_len=1
metrics_server: http://prometheus-prometheus.observability:9090

#! =============================================
#! Controller
#! =============================================

#@schema/desc "The number of replicas. Additional replicas are standby via leader election. With more than 1 replica, a PodDisruptionBudget is created."
#@schema/validation min=1
replicas: 1

#@schema/desc "Container flags, merged on top of the ones computed by the package. Set a flag to null to remove it. See https://github.com/fluxcd/flagger/blob/main/cmd/flagger/main.go."
#@schema/examples ("Alerting", {"slack-url": "https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK", "slack-channel": "deployments", "cluster-name": "production"}), ("Multi-tenancy lockdown", {"no-cross-namespace-refs": True})
#@schema/type any=True
args: {}

#! =============================================
#! Trust
#! =============================================

#@schema/desc "PEM-encoded certificates of additional certificate authorities to trust, for example to reach a metrics provider, a webhook, or an alert provider. The system ones are still trusted."
ca_cert_data: ""

#! =============================================
#! Observability
#! =============================================

#@schema/desc "Settings for logs and metrics."
observability:
  logging:
    #@schema/desc "The log level of Flagger."
    #@schema/validation one_of=["debug", "info", "warn", "error"]
    level: info
    #@schema/desc "The format of the logs."
    #@schema/validation one_of=["text", "json"]
    format: json
  metrics:
    #@schema/desc "Whether to annotate the Pods for Prometheus scraping. Flagger always exposes metrics on port 8080 (`/metrics`)."
    enabled: true

#! =============================================
#! Policies
#! =============================================

#@schema/desc "Settings for the Kyverno policies."
policies:
  #@schema/desc "Whether to include the Kyverno policies that validate and secure the package installation. They require Kyverno 1.19 or later."
  enabled: false

#! =============================================
#! Proxy
#! =============================================

#@schema/desc "Settings for the corporate proxy, used to reach metrics providers, webhooks, and alert providers."
proxy:
  #@schema/desc "The HTTP proxy to use for network traffic."
  http_proxy: ""
  #@schema/desc "The HTTPS proxy to use for network traffic."
  https_proxy: ""
  #@schema/desc "A comma-separated list of hostnames, IP addresses, or IP ranges in CIDR format that should not use the proxy. Include the in-cluster domains, since Flagger reaches Prometheus and the webhooks, like the load tester, within the cluster."
  #@schema/examples ("Bypass the proxy for in-cluster traffic", ".cluster.local.,.cluster.local,.svc,10.0.0.0/8")
  no_proxy: ""
