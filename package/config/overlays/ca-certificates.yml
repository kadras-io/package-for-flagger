#@ load("@ytt:data", "data")
#@ load("@ytt:overlay", "overlay")
#@ load("/lib/flagger.star", "container", "deployment")

#! The additional certificate authorities are mounted in a separate directory, listed in `SSL_CERT_DIR`.
#! Flagger, written in Go, trusts the certificates in that directory in addition to the system ones,
#! when reaching metrics providers, webhooks, and alert providers.
#! See: https://pkg.go.dev/crypto/x509#SystemCertPool

#@ if data.values.ca_cert_data:
---
apiVersion: v1
kind: Secret
metadata:
  name: flagger-ca-certificates
  namespace: #@ data.values.namespace
type: Opaque
stringData:
  ca.crt: #@ data.values.ca_cert_data

#@overlay/match by=overlay.subset({"kind":"Deployment", "metadata":{"name":deployment}})
---
spec:
  template:
    spec:
      containers:
        #@overlay/match by="name"
        - name: #@ container
          #@overlay/match missing_ok=True
          env:
          - name: SSL_CERT_DIR
            value: /etc/ssl/certs-extra
          #@overlay/match missing_ok=True
          volumeMounts:
          - name: ca-certificates
            mountPath: /etc/ssl/certs-extra
            readOnly: true
      #@overlay/match missing_ok=True
      volumes:
      - name: ca-certificates
        secret:
          secretName: flagger-ca-certificates
#@ end
