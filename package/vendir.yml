apiVersion: vendir.k14s.io/v1alpha1
directories:
- contents:
  - helmChart:
      name: flagger
      repository:
        url: https://flagger.app
      version: 1.42.0
    path: flagger
  path: config/helm/upstream
- contents:
  # The Flagger Helm chart doesn't include CRDs, which are created at runtime.
  # We fetch them explicitly to make it possible to instantiate CR as part of this package. 
  - git:
      ref: v1.42.0
      url: https://github.com/fluxcd/flagger
    includePaths:
    - artifacts/flagger/crd.yaml
    newRootPath: artifacts
    path: flagger
  path: config/carvel/upstream
kind: Config
minimumRequiredVersion: 0.32.0
