---
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
commands:
  - timeout: 170
    script: kubectl wait -n "$NAMESPACE" canary/podinfo-knative --for=jsonpath='{.status.phase}'=Succeeded --timeout=160s
  - script: |
      test "$(kubectl get -n "$NAMESPACE" ksvc/podinfo-knative -o jsonpath='{.metadata.annotations.flagger\.app/primary-revision}')" = podinfo-knative-00002
