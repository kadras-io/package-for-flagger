---
# Flagger initializes the Canary: the primary Deployment serves the traffic, and the canary is scaled to zero.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: podinfo-primary
status:
  readyReplicas: 1
---
apiVersion: v1
kind: Service
metadata:
  name: podinfo-canary
---
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
commands:
  - timeout: 120
    script: kubectl wait -n "$NAMESPACE" canary/podinfo --for=jsonpath='{.status.phase}'=Initialized --timeout=110s
  # Envoy Gateway accepts the HTTPRoute generated by Flagger.
  - timeout: 60
    script: kubectl wait -n "$NAMESPACE" httproute/podinfo --for=jsonpath='{.status.parents[0].conditions[?(@.type=="Accepted")].status}'=True --timeout=50s
  # The `edit` role manages the resources, and the `view` role reads them.
  - script: test "$(kubectl auth can-i create canaries.flagger.app -n $NAMESPACE --as=developer)" = yes
  - script: test "$(kubectl auth can-i delete canaries.flagger.app -n $NAMESPACE --as=developer)" = yes
  - script: test "$(kubectl auth can-i list canaries.flagger.app -n $NAMESPACE --as=viewer)" = yes
  - script: test "$(kubectl auth can-i create canaries.flagger.app -n $NAMESPACE --as=viewer)" = no
