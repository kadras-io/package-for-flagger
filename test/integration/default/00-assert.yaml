---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flagger
  namespace: flagger-system
spec:
  template:
    spec:
      imagePullSecrets:
        - name: canonical-registry-credentials
status:
  readyReplicas: 1
---
apiVersion: v1
kind: Secret
metadata:
  name: canonical-registry-credentials
  namespace: flagger-system
  annotations:
    secretgen.carvel.dev/image-pull-secret: ""
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: e30K
