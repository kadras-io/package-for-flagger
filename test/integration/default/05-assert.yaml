---
# Uninstalling the package keeps the CustomResourceDefinitions, the Canaries, and the primary workloads they own.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: canaries.flagger.app
---
apiVersion: v1
kind: Namespace
metadata:
  name: flagger-system
---
apiVersion: flagger.app/v1beta1
kind: Canary
metadata:
  name: podinfo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: podinfo-primary
status:
  readyReplicas: 1
---
apiVersion: flagger.app/v1beta1
kind: Canary
metadata:
  name: podinfo-knative
