apiVersion: kuttl.dev/v1beta1
kind: TestSuite
testDirs:
- ./test/integration
manifestDirs:
- ./test/setup/assets
parallel: 1
startKIND: true
kindContext: integration
kindNodeCache: true
timeout: 180
artifactsDir: /tmp/kuttl-artifacts
commands:
  - script: |
      kapp deploy -a kapp-controller -y \
        -f https://github.com/carvel-dev/kapp-controller/releases/latest/download/release.yml
  - script: |
      kubectl config set-context --current --namespace=tests && \
      kapp deploy -a kyverno-package -y \
        -f https://github.com/kadras-io/package-for-kyverno/releases/download/v1.19.2/package.yml \
        -f https://github.com/kadras-io/package-for-kyverno/releases/download/v1.19.2/metadata.yml && \
      kapp deploy -a envoy-gateway-package -y \
        -f https://github.com/kadras-io/package-for-envoy-gateway/releases/download/v1.10.0/package.yml \
        -f https://github.com/kadras-io/package-for-envoy-gateway/releases/download/v1.10.0/metadata.yml && \
      kapp deploy -a knative-serving-package -y \
        -f https://github.com/kadras-io/package-for-knative-serving/releases/download/v1.24.0/package.yml \
        -f https://github.com/kadras-io/package-for-knative-serving/releases/download/v1.24.0/metadata.yml
  - script: |
      kubectl config set-context --current --namespace=tests && \
      kapp deploy -a dependencies -y -f ./test/setup/dependencies
