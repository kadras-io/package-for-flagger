apiVersion: v1
kind: Namespace
metadata:
  name: delivery
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flagger
  namespace: delivery
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flagger
  namespace: delivery
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: flagger
(subjects[?namespace != 'delivery'] | length(@)): 0
---
apiVersion: v1
kind: Secret
metadata:
  name: canonical-registry-credentials
  namespace: delivery
