apiVersion: v1
kind: Secret
metadata:
  name: flagger-ca-certificates
  namespace: flagger-system
stringData:
  (starts_with("ca.crt", '-----BEGIN CERTIFICATE-----')): true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flagger
spec:
  template:
    spec:
      (volumes[?name == 'ca-certificates'] | [0].secret.secretName): flagger-ca-certificates
      # The service account token is still mounted.
      (volumes[?name == 'kube-api-access'] | length(@)): 1
      (containers[?name == 'flagger'] | [0]):
        (env[?name == 'SSL_CERT_DIR'] | [0].value): /etc/ssl/certs-extra
        (volumeMounts[?name == 'ca-certificates'] | [0].mountPath): /etc/ssl/certs-extra
        (volumeMounts[?name == 'kube-api-access'] | length(@)): 1
