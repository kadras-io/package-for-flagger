apiVersion: apps/v1
kind: Deployment
metadata:
  name: flagger
spec:
  template:
    metadata:
      (annotations."prometheus.io/scrape" == null): true
      (annotations."prometheus.io/port" == null): true
    spec:
      (containers[?name == 'flagger'] | [0]):
        (contains(command, '-log-level=debug')): true
        # Flagger calls the text format `console`.
        (contains(command, '-zap-encoding=console')): true
